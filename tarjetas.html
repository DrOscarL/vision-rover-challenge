<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tarjetas B/N · Vision Rover</title><style>body{font:16px Arial,sans-serif;margin:24px;color:#111}h1{font-size:23px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:22px;max-width:900px}.card{border:2px dashed #888;padding:15px;display:flex;align-items:center;gap:30px;break-inside:avoid}.card svg{width:180px;height:180px;flex-shrink:0}.label{font-size:25px;font-weight:900}.arrow{font-size:48px}@media print{button,.tip{display:none}.card{page-break-inside:avoid}}@media(max-width:680px){.grid{grid-template-columns:1fr}.card svg{width:140px;height:140px}}</style></head><body><h1>Vision Rover Challenge · Tarjetas monocromáticas</h1><p class="tip">Imprime al 100 % sin ajustes de escala, con tinta negra sobre papel blanco. Evita reflejos; muestra el cuadrado completo a la cámara.</p><button onclick="print()">Imprimir tarjetas</button><div class="grid" id="cards"></div><script>
const codes=['1111010000000011110010010','0111001011100100011001000','1110111010110101010001110','1000011000000101111000111'];codes.push('1000111000011011001011001');const names=['AVANZAR','DERECHA','RETROCEDER','IZQUIERDA','PARAR'],arrows=['↑','→','↓','←','■'];const root=document.getElementById('cards');
codes.forEach((code,i)=>{let svg='<svg viewBox="0 0 210 210" xmlns="http://www.w3.org/2000/svg"><rect width="210" height="210" fill="white"/>';for(let y=0;y<7;y++)for(let x=0;x<7;x++){const black=x===0||x===6||y===0||y===6?1:Number(code[(y-1)*5+x-1]);if(black)svg+='<rect x="'+(x*30)+'" y="'+(y*30)+'" width="30" height="30" fill="black"/>'}svg+='</svg>';const article=document.createElement('div');article.className='card';article.innerHTML=svg+'<div><div class="arrow">'+arrows[i]+'</div><div class="label">'+names[i]+'</div></div>';root.appendChild(article)});
</script></body></html>
